name: Auto Linter

on:
  push:
    paths:
      - "**/*.py"

jobs:
  code-clone:
    runs-on: ubuntu-latest
    steps:
      # Code Clone
      - name: Code Checkout/ Code Clone
        uses: actions/checkout@v7

      # Setup Python
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Install Ruff & Run Checks
      - name: Run Ruff Checks
        run: |
         pip install ruff
         ruff check .  --fix
         ruff format .
  
